# ============================================================
# RTi-YOLO — 4-head detection (P3/P4/P5/P6), true 5-level pyramid
# Backbone : RFAConv×2 → (C3k2_iRMB + AggAttn)×3 → Conv
#            → C3k2_iRMB + StdAttn (S32) → Conv → SPPF → C2PSA_DAT
#
# Every level from P3 through S32 follows the same pattern: C3k2_iRMB for
# local feature extraction (+SE inside iRMB), immediately followed by an
# attention stage at the SAME resolution (no downsampling) that adds global
# context before the next Conv downsample. sr_ratio shrinks with resolution
# (8 -> 4 -> 2) for P3/P4/P5 (AggAttn, window-local + pooled-global hybrid);
# S32 uses StdAttn (sr_ratio=1, plain global self-attention) since its
# resolution (20x20=400 tokens) is small enough that the pooled-branch
# machinery in AggAttn brings little benefit. P6 itself has no separate
# attention stage: C2PSA_DAT already applies deformable attention there, so
# a further StdAttn immediately before it would be redundant.
#
# Local-before-global ordering (C3k2_iRMB then attention, not the reverse)
# is deliberate: it lets local feature extraction sharpen faint, spatially
# concentrated defect cues before they are mixed non-locally, and mirrors
# the block-then-grid attention ordering used in hybrid CNN-attention
# backbones such as MaxViT.
#
# Pyramid strides (backbone):
#   P3  stride  4   (160×160)  — C3k2_iRMB + AggAttn(sr=8)
#   P4  stride  8   ( 80×80)   — C3k2_iRMB + AggAttn(sr=4)
#   P5  stride 16   ( 40×40)   — C3k2_iRMB + AggAttn(sr=2)
#   S32 stride 32   ( 20×20)   — C3k2_iRMB + StdAttn(sr=1); intermediate FPN/PAN lateral, NOT a detect head
#   P6  stride 64   ( 10×10)   — Conv → SPPF → C2PSA_DAT, true P6
#
# Neck     : FPN (top-down, SE + C3k2_iRMB) over 5 levels
#          + PAN (bottom-up, C3k2_iRMB) over 5 levels
# Head     : 4× Detect  160×160 / 80×80 / 40×40 / 10×10
#            (S32 node participates in the neck but is not directly supervised)
#
# Tensor notation:  B × C × H × W
# All spatial sizes assume 640×640 input.
# ============================================================

nc: 8          # number of classes
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# ============================================================
# BACKBONE
# ============================================================
backbone:
  # ── Stem ──────────────────────────────────────────────────
  - [-1, 1, RFAConv, [64, 3, 2]]                     #  0  Bx3x640x640    → Bx64x320x320
  - [-1, 1, RFAConv, [128, 3, 2]]                    #  1  Bx64x320x320   → Bx128x160x160

  # ── Stage 1  P3  (stride 4) ────────────────────────────────
  - [-1, 1, C3k2_iRMB, [256, False, 0.25]]           #  2  Bx128x160x160  → Bx256x160x160
  - [-1, 1, AggAttn, [256, 2, 8, 3, 8, 8.0]]         #  3  Bx256x160x160  → Bx256x160x160  [P3]
  - [-1, 1, Conv, [256, 3, 2]]                       #  4  Bx256x160x160  → Bx256x80x80

  # ── Stage 2  P4  (stride 8) ────────────────────────────────
  - [-1, 1, C3k2_iRMB, [512, False, 0.25]]           #  5  Bx256x80x80    → Bx512x80x80
  - [-1, 1, AggAttn, [512, 2, 16, 3, 4, 8.0]]        #  6  Bx512x80x80    → Bx512x80x80    [P4]
  - [-1, 1, Conv, [512, 3, 2]]                       #  7  Bx512x80x80    → Bx512x40x40

  # ── Stage 3  P5  (stride 16) ───────────────────────────────
  - [-1, 1, C3k2_iRMB, [512, True]]                  #  8  Bx512x40x40    → Bx512x40x40
  - [-1, 1, AggAttn, [512, 6, 16, 3, 2, 4.0]]        #  9  Bx512x40x40    → Bx512x40x40    [P5]
  - [-1, 1, Conv, [1024, 3, 2]]                      # 10  Bx512x40x40    → Bx1024x20x20

  # ── Stage 4  S32 (stride 32, intermediate lateral only) ────
  - [-1, 1, C3k2_iRMB, [1024, True]]                 # 11  Bx1024x20x20   → Bx1024x20x20
  - [-1, 1, StdAttn, [1024, 2, 32, 4.0]]             # 12  Bx1024x20x20   → Bx1024x20x20   [S32]
  - [-1, 1, Conv, [1024, 3, 2]]                      # 13  Bx1024x20x20   → Bx1024x10x10

  # ── Stage 5  P6  (stride 64, true deepest level) ───────────
  - [-1, 1, SPPF, [1024, 5]]                         # 14  Bx1024x10x10   → Bx1024x10x10
  - [-1, 1, C2PSA_DAT, [1024]]                       # 15  Bx1024x10x10   → Bx1024x10x10   [P6]

# ============================================================
# NECK  (FPN top-down over 5 levels + PAN bottom-up over 5 levels)
# ============================================================
neck:
  # ── FPN  P6 → S32  (20×20) ─────────────────────────────────
  - [-1,      1, nn.Upsample, [None, 2, 'nearest']]  # 16  Bx1024x10x10  → Bx1024x20x20
  - [[-1,12], 1, Concat,      [1]]                   # 17  (1024+1024)   → Bx2048x20x20
  - [-1,      1, C3k2_iRMB,   [1024, False]]         # 18  Bx2048x20x20  → Bx1024x20x20
  - [-1,      1, SE,          [1024]]                # 19  Bx1024x20x20  → Bx1024x20x20

  # ── FPN  S32 → P5  (40×40) ─────────────────────────────────
  - [-1,     1, nn.Upsample, [None, 2, 'nearest']]   # 20  Bx1024x20x20  → Bx1024x40x40
  - [[-1,9], 1, Concat,      [1]]                    # 21  (1024+512)    → Bx1536x40x40
  - [-1,     1, C3k2_iRMB,   [512, False]]           # 22  Bx1536x40x40  → Bx512x40x40
  - [-1,     1, SE,          [512]]                  # 23  Bx512x40x40   → Bx512x40x40

  # ── FPN  P5 → P4  (80×80) ──────────────────────────────────
  - [-1,     1, nn.Upsample, [None, 2, 'nearest']]   # 24  Bx512x40x40   → Bx512x80x80
  - [[-1,6], 1, Concat,      [1]]                    # 25  (512+512)     → Bx1024x80x80
  - [-1,     1, C3k2_iRMB,   [256, False]]           # 26  Bx1024x80x80  → Bx256x80x80
  - [-1,     1, SE,          [256]]                  # 27  Bx256x80x80   → Bx256x80x80

  # ── FPN  P4 → P3  (160×160) ────────────────────────────────
  - [-1,     1, nn.Upsample, [None, 2, 'nearest']]   # 28  Bx256x80x80   → Bx256x160x160
  - [[-1,3], 1, Concat,      [1]]                    # 29  (256+256)     → Bx512x160x160
  - [-1,     1, C3k2_iRMB,   [256, False]]           # 30  Bx512x160x160 → Bx256x160x160  → Detect P3

  # ── PAN  P3 → P4  (80×80) ──────────────────────────────────
  - [-1,      1, SE,   [256]]                        # 31  Bx256x160x160 → Bx256x160x160
  - [-1,      1, Conv, [256, 3, 2]]                  # 32  Bx256x160x160 → Bx256x80x80
  - [[-1,27], 1, Concat, [1]]                        # 33  (256+256)     → Bx512x80x80
  - [-1,      1, C3k2_iRMB, [512, False]]            # 34  Bx512x80x80   → Bx512x80x80    → Detect P4

  # ── PAN  P4 → P5  (40×40) ──────────────────────────────────
  - [-1,      1, Conv, [512, 3, 2]]                  # 35  Bx512x80x80   → Bx512x40x40
  - [[-1,23], 1, Concat, [1]]                        # 36  (512+512)     → Bx1024x40x40
  - [-1,      1, C3k2_iRMB, [1024, False]]           # 37  Bx1024x40x40  → Bx1024x40x40   → Detect P5

  # ── PAN  P5 → S32  (20×20) ─────────────────────────────────
  - [-1,      1, Conv, [1024, 3, 2]]                 # 38  Bx1024x40x40  → Bx1024x20x20
  - [[-1,19], 1, Concat, [1]]                        # 39  (1024+1024)   → Bx2048x20x20
  - [-1,      1, C3k2_iRMB, [1024, False]]           # 40  Bx2048x20x20  → Bx1024x20x20   (S32 node, not detected)

  # ── PAN  S32 → P6  (10×10) ─────────────────────────────────
  - [-1,      1, Conv, [1024, 3, 2]]                 # 41  Bx1024x20x20  → Bx1024x10x10
  - [[-1,15], 1, Concat, [1]]                        # 42  (1024+1024)   → Bx2048x10x10
  - [-1,      1, C3k2_iRMB, [1024, True]]            # 43  Bx2048x10x10  → Bx1024x10x10   → Detect P6

# ============================================================
# HEAD
# ============================================================
head:
  - [[30, 34, 37, 43], 1, Detect, [nc]]
  #   30 → P3  Bx256x160x160   stride  4   tiny defects
  #   34 → P4  Bx512x80x80     stride  8   small defects
  #   37 → P5  Bx1024x40x40    stride 16   medium defects
  #   43 → P6  Bx1024x10x10    stride 64   extra-large defects (true P6)

# ============================================================
# CHANNEL FLOW   (640×640 input)
# ============================================================
# idx  Module                            in-ch     out-ch    H×W
# ────────────────────────────────────────────────────────────
# Backbone
#  0   RFAConv[64,3,2]                        3        64   320×320
#  1   RFAConv[128,3,2]                      64       128   160×160
#  2   C3k2_iRMB[256,F,0.25]                128       256   160×160
#  3   AggAttn[256,d2,h8,w3,sr8,m8]          256       256   160×160  ← P3
#  4   Conv[256,3,2]                        256       256    80×80
#  5   C3k2_iRMB[512,F,0.25]                256       512    80×80
#  6   AggAttn[512,d2,h16,w3,sr4,m8]         512       512    80×80   ← P4
#  7   Conv[512,3,2]                        512       512    40×40
#  8   C3k2_iRMB[512,T]                     512       512    40×40
#  9   AggAttn[512,d6,h16,w3,sr2,m4]         512       512    40×40   ← P5
# 10   Conv[1024,3,2]                       512      1024    20×20
# 11   C3k2_iRMB[1024,T]                   1024      1024    20×20
# 12   StdAttn[1024,d2,h32,m4]             1024      1024    20×20   ← S32 (intermediate)
# 13   Conv[1024,3,2]                      1024      1024    10×10
# 14   SPPF[1024,5]                        1024      1024    10×10
# 15   C2PSA_DAT[1024]                     1024      1024    10×10   ← P6 (true, stride 64)
#
# FPN (top-down)
# 16   Upsample(#15)                       1024      1024    20×20
# 17   Concat(#16, #12)               1024+1024      2048    20×20
# 18   C3k2_iRMB[1024,F]                   2048      1024    20×20
# 19   SE[1024]                            1024      1024    20×20
# 20   Upsample(#19)                       1024      1024    40×40
# 21   Concat(#20, #9)                 1024+512      1536    40×40
# 22   C3k2_iRMB[512,F]                    1536       512    40×40
# 23   SE[512]                              512       512    40×40
# 24   Upsample(#23)                        512       512    80×80
# 25   Concat(#24, #6)                  512+512      1024    80×80
# 26   C3k2_iRMB[256,F]                    1024       256    80×80
# 27   SE[256]                              256       256    80×80
# 28   Upsample(#27)                        256       256   160×160
# 29   Concat(#28, #3)                  256+256       512   160×160
# 30   C3k2_iRMB[256,F]                     512       256   160×160  → Detect P3
#
# PAN (bottom-up)
# 31   SE[256]   (#30)                      256       256   160×160
# 32   Conv[256,3,2]                        256       256    80×80
# 33   Concat(#32, #27)                 256+256       512    80×80
# 34   C3k2_iRMB[512,F]                     512       512    80×80   → Detect P4
# 35   Conv[512,3,2]                        512       512    40×40
# 36   Concat(#35, #23)                 512+512      1024    40×40
# 37   C3k2_iRMB[1024,F]                   1024      1024    40×40   → Detect P5
# 38   Conv[1024,3,2]                      1024      1024    20×20
# 39   Concat(#38, #19)               1024+1024      2048    20×20
# 40   C3k2_iRMB[1024,F]                   2048      1024    20×20   (S32 node, not detected)
# 41   Conv[1024,3,2]                      1024      1024    10×10
# 42   Concat(#41, #15)               1024+1024      2048    10×10
# 43   C3k2_iRMB[1024,T]                   2048      1024    10×10   → Detect P6
